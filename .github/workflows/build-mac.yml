name: Build Mac app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: electron
      - run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dist' }}
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: WireFrame-mac
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
